{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/buttons.css' %}">
  <link rel="stylesheet" href="{% static 'css/assinaturas.css' %}">
</head>
<body class="assinatura-publica-body">
  <main class="assinatura-publica">
    <header class="assinatura-publica__header">
      <div>
        <p class="assinatura-publica__brand">Central de Viagens</p>
        <h1>Assinatura digital de documento</h1>
      </div>
    </header>

    <section class="assinatura-publica__summary" aria-label="Dados da assinatura">
      <div>
        <span>Documento</span>
        <strong>{{ artefato.tipo|default:"Documento" }}</strong>
      </div>
      <div>
        <span>Destinatário</span>
        <strong>{{ pedido.nome_assinante_snapshot }}</strong>
      </div>
      <div>
        <span>CPF</span>
        <strong>{{ cpf_mascarado }}</strong>
      </div>
      <div>
        <span>Status</span>
        <strong>{{ pedido.get_status_display }}</strong>
      </div>
    </section>

    <section class="assinatura-publica__viewer" aria-label="Documento para assinatura">
      <iframe src="{{ pdf_url }}" title="Documento para assinatura"></iframe>
    </section>

    <section class="assinatura-publica__actions" aria-label="Confirmação">
      <form method="post" action="{% url 'assinaturas:assinatura-token-confirmar' pedido.token %}" class="assinatura-publica__form">
        {% csrf_token %}
        <label class="assinatura-publica__check">
          <input type="checkbox" name="ciencia" value="1" required>
          <span>Declaro que li o documento.</span>
        </label>
        <label class="assinatura-publica__check">
          <input type="checkbox" name="identidade" value="1" required>
          <span>Confirmo que sou o destinatário desta assinatura.</span>
        </label>
        <div class="assinatura-publica__buttons">
          <button type="submit" class="btn btn-primary app-btn app-btn--primary">Assinar documento</button>
        </div>
      </form>
      <form method="post" action="{% url 'assinaturas:assinatura-token-recusar' pedido.token %}" class="assinatura-publica__recusa">
        {% csrf_token %}
        <label for="motivo-recusa">Motivo da recusa</label>
        <textarea id="motivo-recusa" name="motivo" rows="3"></textarea>
        <button type="submit" class="btn btn-secondary app-btn app-btn--secondary">Recusar assinatura</button>
      </form>
    </section>
  </main>
</body>
</html>
