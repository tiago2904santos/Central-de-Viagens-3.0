<div class="form-actions app-form-actions oficio-wizard__actions">
  {% include "components/buttons/action_button.html" with href=back_url label="Voltar para lista" variant="secondary" only %}
  {% if oficio %}
    <a class="btn btn-secondary" href="{% url 'oficios:baixar_documento' oficio.pk 'docx' %}">DOCX</a>
    <a class="btn btn-secondary" href="{% url 'oficios:baixar_documento' oficio.pk 'pdf' %}">PDF</a>
  {% endif %}
  <button class="btn btn-secondary" type="submit" name="action" value="save_draft">Salvar rascunho</button>
  <button class="btn btn-primary" type="submit" name="action" value="save_continue">Salvar e continuar</button>
</div>
